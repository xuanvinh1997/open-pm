<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <div style="background: #f9fafb; border-radius: 8px; padding: 32px;">
    <h2 style="font-size: 18px; margin: 0 0 8px;">Issue Assigned</h2>
    <p style="font-size: 14px; color: #6b7280; margin: 0 0 16px;">
      You were assigned to <strong>{{.IssueName}}</strong> in {{.ProjectName}}.
    </p>
    <div style="background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 16px; margin: 0 0 24px;">
      <p style="font-size: 14px; margin: 0;">
        <strong>{{.IssueIdentifier}}</strong> &mdash; {{.IssueName}}
      </p>
      {{if .Priority}}
      <p style="font-size: 12px; color: #6b7280; margin: 4px 0 0;">Priority: {{.Priority}}</p>
      {{end}}
    </div>
    <a href="{{.IssueURL}}" style="display: inline-block; background: #3b82f6; color: #ffffff; padding: 10px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">
      View Issue
    </a>
  </div>
</body>
</html>
