<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #1f2937;">
  <div style="background: #f9fafb; border-radius: 8px; padding: 32px; text-align: center;">
    <h1 style="font-size: 24px; margin: 0 0 8px;">You're invited!</h1>
    <p style="font-size: 16px; color: #6b7280; margin: 0 0 24px;">
      You've been invited to join <strong>{{.WorkspaceName}}</strong> on Open-PM.
    </p>
    {{if .Message}}
    <p style="font-size: 14px; color: #6b7280; font-style: italic; margin: 0 0 24px;">
      "{{.Message}}"
    </p>
    {{end}}
    <a href="{{.AcceptURL}}" style="display: inline-block; background: #3b82f6; color: #ffffff; padding: 12px 32px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">
      Accept Invitation
    </a>
    <p style="font-size: 12px; color: #9ca3af; margin: 24px 0 0;">
      If you didn't expect this invitation, you can safely ignore this email.
    </p>
  </div>
</body>
</html>
